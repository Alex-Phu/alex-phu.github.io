<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Alex Phu: student researcher and developer. Explore a 3D desk of projects in medical AI, computer vision, and health tech.">
<title>Alex Phu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage"></div>

<section id="bios" aria-live="polite">
  <div class="hdr">APBIOS v27.0 &nbsp;Alex Phu Workstation</div>
  <pre id="log"></pre>
  <pre id="bar"></pre>
  <button id="boot" type="button" disabled>BOOT</button>
</section>

<header id="brand" class="ui">
  <h1>Alex Phu</h1>
  <p>Student researcher &amp; developer · Class of 2027</p>
</header>
<div id="topright" class="ui">
  <button id="back" type="button" hidden><span class="long">Back to room (Esc)</span><span class="short">Back</span></button>
  <button id="soundBtn" type="button" aria-pressed="true">Sound on</button>
</div>
<nav id="explore" class="ui" aria-label="Explore the desk">
  <span>Explore</span>
</nav>
<div id="credit" class="ui">Concept inspired by Henry Heffernan's portfolio</div>
<div id="tip" hidden></div>
<div id="hint" class="ui" hidden><i></i><span class="long">Click anything that glows</span><span class="short">Tap anything that glows</span></div>
<section id="mos" class="ui" hidden role="dialog" aria-label="AlexOS">
  <div class="mos-bar"><span>◆ AlexOS</span><button id="mosClose" type="button" aria-label="Close AlexOS">×</button></div>
  <div class="mos-tabs"></div>
  <div class="os-body"></div>
</section>
<aside id="card" class="ui" hidden aria-live="polite">
  <button id="cardClose" type="button" aria-label="Close">×</button>
  <div class="tag" id="cTag"></div>
  <h2 id="cTitle"></h2>
  <p id="cBody"></p>
  <ul id="cTech"></ul>
  <a id="cLink" target="_blank" rel="noopener" hidden></a>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
